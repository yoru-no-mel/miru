[package]
name = "miru"
version = "1.0.0"
edition = "2021"

[build-dependencies]
ab_glyph = "0.2"
winresource = "0.1"

[features]
default = ["rar"]
rar = ["dep:unrar"]

[dependencies]
eframe = { version = "0.32", features = ["default_fonts"] }
egui = "0.32"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
zip = "2"
sevenz-rust = "0.6"
tar = "0.4"
flate2 = "1"
unrar = { version = "0.5", optional = true }
natord = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
